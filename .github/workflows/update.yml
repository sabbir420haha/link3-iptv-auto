name: Refresh Link3 IPTV Pro
on:
  push:
    branches: [main]
    paths:
      - channels.json
      - update.py
      - logos.py
      - logos_local.py
      - geo_trial.py
      - favorite_search_a.json
      - favorite_search_b.json
      - favorites_test_registry.json
      - tv_playback_health.py
      - main_pin_diagnostic.py
      - main_pin_policy_test.py
      - repair_nine_smoke_test.py
      - three_missing_probe.py
      - three_playback_health.py
      - .github/workflows/update.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: link3-iptv-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script and Main pin policy
        run: |
          python -m py_compile update.py geo_trial.py three_playback_health.py tv_playback_health.py main_pin_diagnostic.py main_pin_policy_test.py
          python -m unittest main_pin_policy_test.py repair_nine_smoke_test.py
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Install ffprobe for audio metadata checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
      - name: Discover and test publicly available HLS streams
        run: python update.py
      - name: Add official/high-resolution logos and clear fallback images
        run: python logos.py
      - name: Mirror high-quality channel-logo PNGs into this repository
        run: python logos_local.py
      - name: Generate separate optional BD-region test playlist
        run: python geo_trial.py
      - name: Check fresh three-channel candidates without publishing unverified feeds
        run: python three_missing_probe.py
      - name: Check current video-source stability from runner without replacing streams
        run: python tv_playback_health.py
      - name: Diagnose the nine Main pins (DNS, HTTP, HLS segments and live progress; read-only)
        run: python main_pin_diagnostic.py
      - name: Observe HLS continuity for Channel 24, Hungama, Zee Bangla without changing streams
        run: python three_playback_health.py
      - name: Commit updated playlist and status
        run: |
          # A refresh can run using a checkout made BEFORE the user confirms
          # and pins a new working stream. Never publish old generated M3U
          # over a newer channels.json or manually fixed playlist.m3u.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::Main changed during refresh. Skipping stale generated playlist; a newer run will use the latest channel pins."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u geo_trials.m3u favorites_tests.m3u status.json tv_stream_health.json main_pin_health.json three_missing_probe.json three_playback_health.json logos/
          if ! git diff --cached --quiet; then
            git commit -m 'Update curated Link3 IPTV playlist'
            # Never rebase a stale generated M3U over newer user changes.
            if ! git push; then
              echo "::warning::Main advanced before the push. Dropping stale generated output instead of overwriting a user-confirmed pin."
              exit 0
            fi
          fi
