name: Refresh Link3 IPTV Pro
on:
  push:
    branches: [main]
    paths:
      - channels.json
      - update.py
      - logos.py
      - logos_local.py
      - geo_trial.py
      - tv_playback_health.py
      - three_missing_probe.py
      - .github/workflows/update.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: link3-iptv-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile update.py
      - name: Install image tools
        run: python -m pip install Pillow==11.3.0
      - name: Discover and test publicly available HLS streams
        run: python update.py
      - name: Add official/high-resolution logos and clear fallback images
        run: python logos.py
      - name: Mirror high-quality channel-logo PNGs into this repository
        run: python logos_local.py
      - name: Generate separate optional BD-region test playlist
        run: python geo_trial.py
      - name: Check fresh three-channel candidates without publishing unverified feeds
        run: python three_missing_probe.py
      - name: Check current video-source stability from runner without replacing streams
        run: python tv_playback_health.py
      - name: Commit updated playlist and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u geo_trials.m3u status.json tv_stream_health.json three_missing_probe.json logos/
          if ! git diff --cached --quiet; then
            git commit -m 'Update curated Link3 IPTV playlist'
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
