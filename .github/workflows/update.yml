name: Refresh Link3 IPTV Pro
on:
  push:
    branches: [main]
    paths:
      - channels.json
      - update.py
      - .github/workflows/update.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: link3-iptv-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile update.py
      - name: Discover and test publicly available HLS streams
        run: python update.py
      - name: Commit updated playlist and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u status.json
          git diff --cached --quiet || (git commit -m 'Update curated Link3 IPTV playlist' && git push)
