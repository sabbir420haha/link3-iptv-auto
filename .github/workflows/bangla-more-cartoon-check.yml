name: Check fresh Bengali animated TV live alternatives
on:
  push:
    branches: [main]
    paths:
      - bangla_more_cartoon_sources.json
      - bangla_more_cartoon_probe.py
      - .github/workflows/bangla-more-cartoon-check.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bengali-more-cartoon-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder and inspect actual frames
        run: |
          python -m pip install --disable-pip-version-check av==15.1.0
          python bangla_more_cartoon_probe.py
      - name: Save report without touching playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bangla_more_cartoon_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record new Bangla cartoon stream playback probes'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
