name: Sonic Hindi independent validation 2026-10-30 run 7
on:
  push:
    branches: [sonic-hindi-probe-20261030-7]
    paths: ['.github/workflows/sonic-hindi-probe-20261030-7.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check genuine video decoding twice for each fresh candidate
        shell: bash
        run: |
          cat > /tmp/sonic_probe.py <<'PY'
          import json, subprocess, datetime, re
          candidates = [
            ("C01", "http://103.122.249.134:8000/play/a051", "iptv-org/iptv issue 37823 Sonic.in@SD"),
            ("C02", "http://103.154.3.101:5001/live/815.m3u8", "iptv-org/iptv issue 36782 Sonic.in@SD"),
            ("C03", "http://iptvcasomsapi.jprdigital.in/x-media/C0368/master.m3u8", "iptv-org/iptv issue 33980 Sonic.in@SD"),
            ("C04", "http://iptvcasomsapi.jprdigital.in/x-media/C0407/master.m3u8", "iptv-org/iptv issue 33979 Sonic.in@SD")
          ]
          results = []
          for ident, url, source in candidates:
            item = {"id":ident,"url":url,"source":source,"fetches":[]}
            for i in range(2):
              cmd = ["ffmpeg","-hide_banner","-nostdin","-loglevel","error","-rw_timeout","10000000","-i",url,"-map","0:v:0","-an","-t","7","-frames:v","50","-f","null","-","-progress","pipe:1"]
              try:
                p = subprocess.run(cmd,capture_output=True,text=True,timeout=30)
                frames = [int(x) for x in re.findall(r"(?m)^frame=(\d+)",p.stdout)]
                item["fetches"].append({"attempt":i+1,"exit":p.returncode,"frames":max(frames or [0]),"stderr":p.stderr[-700:],"decoded":p.returncode==0 and max(frames or [0])>0})
              except Exception as e:
                item["fetches"].append({"attempt":i+1,"decoded":False,"error":str(e)})
            try:
              p = subprocess.run(["ffprobe","-v","error","-rw_timeout","10000000","-show_entries","stream=codec_type,codec_name,width,height:stream_tags=language","-of","json",url],capture_output=True,text=True,timeout=22)
              item["ffprobe"] = {"exit":p.returncode,"streams":json.loads(p.stdout).get("streams",[]) if p.returncode==0 else [],"error":p.stderr[-500:]}
            except Exception as e:
              item["ffprobe"]={"error":str(e)}
            item["validated_twice"] = all(x.get("decoded") for x in item["fetches"])
            results.append(item)
          output={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"method":"GitHub Actions ubuntu-latest, ffmpeg 2 independent fetches with real decoded video frames; ffprobe audio metadata","results":results}
          with open("sonic_probe_run7_results.json","w") as f:json.dump(output,f,indent=2)
          print(json.dumps(output,indent=2))
          PY
          python /tmp/sonic_probe.py
      - name: Commit probe results only to isolated validation branch
        if: always()
        shell: bash
        run: |
          if [ -f sonic_probe_run7_results.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sonic_probe_run7_results.json
            git commit -m "Record Sonic Hindi remote video decoding run 7" || true
            git push origin HEAD:sonic-hindi-probe-20261030-7
          fi
