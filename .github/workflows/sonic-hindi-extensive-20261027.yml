name: Investigate more Sonic Hindi playback sources Oct 27
on:
  push:
    branches: [main]
    paths:
      - sonic_hindi_extensive_20261027_sources.json
      - sonic_hindi_extensive_20261027_probe.py
      - .github/workflows/sonic-hindi-extensive-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sonic-hindi-extensive-oct27
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode candidates without touching user playlists
        run: |
          python -m pip install --disable-pip-version-check av==15.1.0
          python sonic_hindi_extensive_20261027_probe.py
      - name: Save evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sonic_hindi_extensive_20261027_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record expanded Sonic Hindi playback and audio checks'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
