name: Test Sony YAY Hindi Live Playback
on:
  push:
    branches: [main]
    paths:
      - sony_yay_candidates.json
      - sony_yay_probe.py
      - .github/workflows/sony-yay-probe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sony-yay-video-probe
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Decode repeated video frames and inspect live segment advancement
        run: python sony_yay_probe.py
      - name: Commit ONLY Sony YAY TEST and its results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documentary_hd_tests.m3u sony_yay_probe_results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 90-second remotely checked Sony YAY Hindi TEST alternatives only'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
