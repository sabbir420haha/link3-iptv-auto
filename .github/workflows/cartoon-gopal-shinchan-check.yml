name: Investigate Gopal Bhar and Shinchan Hindi new leads
on:
  push:
    branches: [main]
    paths:
      - cartoon_gopal_shinchan_new_leads.json
      - cartoon_gopal_shinchan_probe.py
      - cartoon_stillonair_discovery.py
      - .github/workflows/cartoon-gopal-shinchan-check.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original new links only
        run: |
          python cartoon_gopal_shinchan_probe.py
          python cartoon_stillonair_discovery.py
      - name: Store check report without modifying any playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartoon_gopal_shinchan_new_health.json cartoon_stillonair_public_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Gopal Bhar and Shinchan Hindi investigation"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
