name: Channel 24 official YouTube Live refresh
on:
  push:
    branches: [main]
    paths:
      - channel24_youtube_refresh.py
      - .github/workflows/channel24-youtube.yml
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: link3-iptv-refresh
  cancel-in-progress: false
jobs:
  channel24:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube stream metadata extractor
        run: python -m pip install --upgrade yt-dlp
      - name: Check official live and refresh ONLY Channel 24 YT HLS TEST
        run: python channel24_youtube_refresh.py
      - name: Commit refreshed playlist or fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channels.json playlist.m3u channel24_youtube_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Channel 24 official YouTube HLS trial'
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
