name: Probe replacement cartoon 24x7 candidates
on:
  push:
    branches: [main]
    paths:
      - cartoon_replacement_probe.py
      - .github/workflows/cartoon-replacement-probe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: replacement-cartoon-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and test alternative HLS streams only
        run: |
          python -m py_compile cartoon_stream_probe.py cartoon_replacement_probe.py
          python cartoon_replacement_probe.py
      - name: Save diagnostic report, never touch playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartoon_replacement_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Report replacement cartoon HLS video-byte checks'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
