name: Check dedicated cartoon-only 24x7 streams
on:
  push:
    branches: [main]
    paths:
      - cartoon_dedicated_probe.py
      - .github/workflows/cartoon-dedicated-test.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dedicated-cartoon-only-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test HLS manifest and real video bytes for candidate sources
        run: |
          python -m py_compile cartoon_stream_probe.py cartoon_dedicated_probe.py
          python cartoon_dedicated_probe.py
      - name: Save diagnostics report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartoon_dedicated_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record dedicated cartoon stream availability diagnostics'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
