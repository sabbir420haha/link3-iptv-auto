name: Legacy Gon Dailymotion Probe (disabled)
# Disabled automatic refresh: CDN links are IP-bound and unusable on Link3.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gon-vod-auto-hourly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode video and audio; generate separate playlist
        run: |
          pip install --disable-pip-version-check yt-dlp requests av==15.1.0
          python gon_vod_auto.py
      - name: Commit refreshed Gon VOD and TEST playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gon_vod.m3u gon_vod_health.json three_channel_test.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Gon Hindi VOD clips inside TEST playlist'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 3
            done
            exit 1
          fi
