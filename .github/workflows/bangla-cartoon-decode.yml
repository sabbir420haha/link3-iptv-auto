name: Decode actual video frames from Bangla cartoon streams
on:
  push:
    branches: [main]
    paths:
      - bangla_cartoon_decode_probe.py
      - .github/workflows/bangla-cartoon-decode.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bangla-cartoon-frame-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video decoder and decode frames
        run: |
          python -m pip install --disable-pip-version-check av==15.1.0
          python bangla_cartoon_decode_probe.py
      - name: Save diagnostic results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bangla_cartoon_decoded_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Report decoded Bengali cartoon video frame availability'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase -X theirs origin/main
              sleep 2
            done
            exit 1
          fi
